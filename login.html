<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — RehabClinic</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg, #f3f4f6);
    }
    .login-card {
      background: var(--surface, #fff);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-card h1 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }
    .login-card p {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-google:hover { background: #f9fafb; }
    .login-error {
      margin-top: 16px;
      color: #dc2626;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>RehabClinic</h1>
    <p>Ingresá con tu cuenta de Google para continuar.</p>
    <button class="btn-google" id="btn-google-login">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Ingresar con Google
    </button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('motivo') === 'no_autorizado') {
    const err = document.getElementById('login-error');
    err.textContent = 'Tu cuenta de Google no tiene acceso a esta aplicación. Contactá al administrador.';
    err.style.display = 'block';
  }

  document.getElementById('btn-google-login').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html') }
    });
  });

  // Si ya hay sesión activa, saltar directo a la app
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });
</script>

</body>
</html>
